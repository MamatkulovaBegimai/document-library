{% extends 'library/base.html' %}

{% block title %}Жаңы сырсөз — Китепкана{% endblock %}

{% block content %}
<main class="wrap upload-page">
  <div class="upload-card" style="max-width: 460px;">
    <h1>Жаңы сырсөз</h1>

    {% if validlink %}
      <form method="post" class="upload-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="field">
          <span>Жаңы сырсөз</span>
          {{ form.new_password1 }}
          {{ form.new_password1.errors }}
        </label>
        <label class="field">
          <span>Сырсөздү кайталаңыз</span>
          {{ form.new_password2 }}
          {{ form.new_password2.errors }}
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Сырсөздү сактоо</button>
        </div>
      </form>
    {% else %}
      <p class="form-error">Бул шилтеме жараксыз же мөөнөтү өтүп кеткен.</p>
      <a href="{% url 'password_reset' %}">Жаңы шилтеме алуу</a>
    {% endif %}
  </div>
</main>
{% endblock %}
