services:
  - type: web
    name: document-library
    runtime: python
    plan: starter
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: document-library-0ze1.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://document-library-0ze1.onrender.com
      - key: STORAGE_PROVIDER
        value: r2
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: document-library-db
          property: connectionString

databases:
  - name: document-library-db
    plan: free